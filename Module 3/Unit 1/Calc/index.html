<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module 3, Unit 1 - Calculator</title>
</head>
<body>  
    <h1>Simple Calculator</h1>
    <form name="calc">
        <label for="num1">Num 1</label>
        <input type="number" id="num1" name="num1" required placeholder="Enter first number">
        <br>
        <label for="num2">Num 2</label>
        <input type="number" id="num2" name="num2" required placeholder="Enter second number">
        <br>
        <label for="op">Operation</label>
        <select id="op" name="op">
            <option value="add">+</option>
            <option value="subtract">-</option>
            <option value="multiply">*</option>
            <option value="divide">/</option>
        </select>
        <button id="calculate" type="button">Calculate</button>
        <br>
        <label id="result">0</label>
    </form>
    <script src="calc.js"></script>
</body>
</html>
